<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MRU Faculty Tools</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 2rem auto;
      padding: 1rem;
      line-height: 1.5;
    }
    #app {
      display: none;
    }
    #status {
      color: #555;
    }
  </style>
</head>
<body>

  <p id="status">Verifying your session…</p>

  <main id="app">
    <h1>Login Successful</h1>
    <p>Redirecting you to the Admin Dashboard...</p>
  </main>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    // ========== YOUR SUPABASE KEYS ==========
    const SUPABASE_URL = "https://oppworrrglnaqechzlfn.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9wcHdvcnJyZ2xuYXFlY2h6bGZuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNjQ5NTcsImV4cCI6MjEwNzY0MDk1N30.aaQbGkRUW067HMxxcgAZ5-j2Ea7YahFiTWrmqszzSGw";
 // =======================================

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const status = document.getElementById("status");
    const app = document.getElementById("app");

    async function checkAccess() {
      const { data: { user }, error } = await supabase.auth.getUser();

      if (error || !user || !user.email_confirmed_at) {
        await supabase.auth.signOut();
        window.location.replace("index.html");
        return;
      }

      const email = user.email.toLowerCase();

      // Check if email is in the allowed list
      const { data: allowed, error: allowError } = await supabase
        .from("allowed_faculty")
        .select("email")
        .eq("email", email)
        .single();

      if (allowError || !allowed) {
        await supabase.auth.signOut();
        window.location.replace("index.html");
        return;
      }

      // ✅ User is allowed → Redirect to the real Admin Dashboard
      window.location.replace("Admin_Dashboard_NBA_C6.html");
    }

    // Run the check
    checkAccess();
  </script>
</body>
</html>
